name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: "arn:aws:iam::325502190209:role/terraform-shipping-lab-github-terraform"
          role-session-name: terraform-shipping-lab-ci
          aws-region: af-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="environments/lab.example.tfvars" -no-color


  deploy:
    needs: terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment: lab

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS deploy credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: "arn:aws:iam::325502190209:role/terraform-shipping-lab-github-deploy"
          role-session-name: terraform-shipping-lab-deploy
          aws-region: af-south-1

      - name: Verify AWS deploy identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file="environments/lab.example.tfvars" -out=tfplan

      - name: Terraform Apply
        run: terraform apply tfplan